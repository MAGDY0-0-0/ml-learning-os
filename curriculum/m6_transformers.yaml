slug: m6-transformers
title: M6 · Transformers — attention to LoRA, no rabbit hole
order: 6
blurb: 'The sequence is deliberate: attention, then architecture, then YOU implement a mini-transformer,
  then you READ nanoGPT rather than reproduce it, then Hugging Face, fine-tuning, LoRA. Reproducing GPT-2
  is explicitly NOT a graduation requirement — it is tagged optional-stretch and the app will warn you
  if you sink more than three units into it.

  '
outcomes:
  - "Explain attention as a lookup with queries, keys and values"
  - "Name every part of a transformer block and what it is for"
  - "Implement attention yourself and match PyTorch's result"
  - "Fine-tune a pretrained model with LoRA on an 8 GB GPU"
units:
- slug: m6-attention
  title: Attention — what it computes and why
  objective: 'Understand queries, keys and values as a soft dictionary lookup, and why this replaced recurrence.

    '
  why: "Attention is the core of every transformer, including the one you implement in two units' time."
  outcomes:
    - "Explain queries, keys and values as a soft lookup"
    - "Say why attention scores are divided by the square root of d_k"
    - "Say what masking does, and why a next-word model needs it"
  needs: [m5-training-loop]
  est_minutes: 90
  resources:
  - kind: playlist
    title: Transformers and attention (3Blue1Brown, chapters 5 and 6)
    url: https://www.youtube.com/playlist?list=PLZHQObOWTQDNU6R1_67000Dx_ZCJB-3pi
    provider: 3Blue1Brown
    est_minutes: 51
    watch:
      - title: "Transformers, the tech behind LLMs"
        video: "wjZofJX0v4M"
        from: "0:00"
        to: "26:03"
        why: >
          Predicting the next token, word embeddings, and softmax with
          temperature: everything attention works on.
      - title: "Attention in transformers, step by step"
        video: "eMlx5fFNoYc"
        from: "0:00"
        to: "24:54"
        why: >
          Queries, keys and values, the attention pattern, masking, and
          multiple heads.
    community_verdict: Widely praised as the clearest visual explanation of attention and transformers
      currently available.
    caveat: Intuition only — no code. You still need the implementation unit.
    cost: free
  - kind: article
    title: The Illustrated Transformer
    url: https://jalammar.github.io/illustrated-transformer/
    provider: Jay Alammar
    est_minutes: 45
    community_verdict: The single most-recommended written explanation of transformers; consistently cited
      across practitioner threads.
    caveat: 2018, so it describes the original encoder-decoder model rather than decoder-only LLMs.
    cost: free
  - kind: video
    title: NLP Tutorial Python (gentler on-ramp)
    url: https://www.youtube.com/playlist?list=PLeo1K3hjS3uuvuAXhYjV2lMEShq2UYSwX
    provider: codebasics
    est_minutes: 60
    community_verdict: Approachable pacing for the NLP fundamentals underneath attention.
    caveat: Broader and shallower; covers classical NLP too.
    cost: free
  - kind: interactive
    title: "Transformer Explainer — watch attention run on your own text"
    url: "https://poloclub.github.io/transformer-explainer/"
    provider: "Georgia Tech Polo Club"
    est_minutes: 25
    community_verdict: "A live GPT-2 running in the browser with every attention head, weight and softmax exposed. Type a sentence and watch the values change — the fastest way to stop treating attention as an abstraction."
    caveat: "Shows you what happens, not why it was designed that way. Pair it with the video, don't substitute it."
    cost: free
  cards:
  - front: In attention, what are Q, K and V?
    back: Query = what this token is looking for; Key = what each token offers; Value = what it contributes
      if matched. softmax(QK^T/sqrt(d))V is a soft dictionary lookup.
  - front: Why divide by sqrt(d_k) in scaled dot-product attention?
    back: Dot products grow with dimension; without scaling, softmax saturates and gradients vanish.
- slug: m6-architecture
  title: 'The transformer block: residuals, norms, positional encoding'
  objective: 'Assemble the full block and understand why each piece is there.

    '
  why: "You implement this block yourself in the next unit, and read it in nanoGPT after that."
  outcomes:
    - "Name each part of a transformer block and what it is for"
    - "Say why a transformer needs positional information"
    - "Explain what residual connections and layer norm add"
  needs: [m6-attention]
  est_minutes: 140
  resources:
  - kind: video
    title: "Let's build GPT: from scratch, in code, spelled out"
    url: https://www.youtube.com/watch?v=kCc8FmEb1nY
    provider: Andrej Karpathy
    est_minutes: 116
    watch:
      - title: "Build a GPT, from the bigram model to the full transformer block"
        video: "kCc8FmEb1nY"
        from: "0:00"
        to: "1:48:53"
        why: >
          Data, a bigram baseline, self-attention built up in four versions,
          then multiple heads, feed-forward layers, residual connections and
          layer norm, and a quick tour of nanoGPT. Skips the closing talk
          about ChatGPT and RLHF.
    community_verdict: Builds a working transformer live, from scratch, explaining every line.
    caveat: Long; take it in two sittings, split at the self-attention section (1:02:00), and type
      along.
    cost: free
  - kind: video
    title: Attention in transformers, step-by-step (Chapter 6)
    url: https://www.youtube.com/watch?v=eMlx5fFNoYc
    provider: 3Blue1Brown
    est_minutes: 26
    community_verdict: The clearest visual walkthrough of attention that exists.
    caveat: Intuition only, no code.
    cost: free
  - kind: video
    title: Attention Is All You Need - full model explanation with maths
    url: https://www.youtube.com/watch?v=bCz4OMemCcA
    provider: Umar Jamil
    est_minutes: 58
    community_verdict: Goes through the paper's maths, inference and training in detail - the step up
      after 3B1B.
    caveat: Dense; pause often.
    cost: free
  - kind: video
    title: Attention for Neural Networks, Clearly Explained
    url: https://www.youtube.com/watch?v=PSs6nxngL6k
    provider: StatQuest
    est_minutes: 16
    community_verdict: Gentlest possible on-ramp if attention still feels like magic.
    caveat: Simplified - it omits multi-head detail.
    cost: free
  - kind: article
    title: The Annotated Transformer
    url: https://nlp.seas.harvard.edu/annotated-transformer/
    provider: Harvard NLP
    est_minutes: 60
    community_verdict: The paper reimplemented line by line alongside the text; a long-standing reference.
    caveat: Follows the original 2017 encoder-decoder design, not modern decoder-only stacks.
    cost: free
  - kind: paper
    title: Attention Is All You Need
    url: https://arxiv.org/abs/1706.03762
    provider: Vaswani et al.
    est_minutes: 60
    community_verdict: The paper that started it. Reading it is itself the skill being taught.
    caveat: Dense and assumes 2017 context. Read it AFTER the visual explanations, not before.
    cost: free
  cards:
  - front: Why does a transformer need positional encoding at all?
    back: Self-attention is permutation-invariant — without positional information, 'dog bites man' and
      'man bites dog' are identical inputs.
  - front: Pre-norm vs post-norm — which do modern LLMs use and why?
    back: Pre-norm (LayerNorm before the sublayer). It makes deep stacks trainable without careful learning-rate
      warmup.
- slug: m6-mini-transformer
  title: Implement your own mini-transformer
  objective: 'Write it yourself, from scratch, small. This is the from-scratch requirement of this module
    — not GPT-2.

    '
  why: "Writing attention yourself is the from-scratch requirement of this module, and it makes nanoGPT readable."
  outcomes:
    - "Implement scaled dot-product attention with a causal mask"
    - "Build multi-head attention and match PyTorch's result"
    - "Show that a later token cannot change an earlier token's output"
  needs: [m6-architecture]
  est_minutes: 180
  needs_gpu: true
  rigor_note: 'Rung: build your own held-out eval set and check for contamination — did your training
    text leak into your evaluation text?

    '
  resources:
  - kind: video
    title: Coding a Transformer from scratch on PyTorch, with full explanation
    url: https://www.youtube.com/watch?v=ISNdQcPhsts
    provider: Umar Jamil
    est_minutes: 179
    watch:
      - title: "Every block, coded: embeddings to the full transformer"
        video: "ISNdQcPhsts"
        from: "1:20"
        to: "1:17:00"
        why: >
          Input embeddings, positional encoding, layer norm, feed-forward,
          multi-head attention, residual connections, encoder, decoder and
          the projection layer. Skips the translation project after 1:17,
          which this unit does not need.
    community_verdict: Codes every block of the transformer in PyTorch with the maths on screen; the
      closest video to what the exercise asks you to write.
    caveat: It builds the original encoder-decoder for translation. The exercise is the attention block
      on its own; write that before you watch him write his.
    cost: free
  - kind: playlist
    title: Zero to Hero — makemore series
    url: https://www.youtube.com/playlist?list=PLAqhIrjkxbuWI23v9cThsA9GvCAUhRvKZ
    provider: Andrej Karpathy
    est_minutes: 120
    community_verdict: Incremental build from bigram to transformer; the best scaffold for writing your
      own.
    caveat: Follow along by typing, not watching. Passive viewing teaches almost nothing here.
    cost: free
  - kind: video
    title: Self Attention in Transformer Neural Networks (with Code)
    url: https://www.youtube.com/watch?v=QCJQG4DuHT0
    provider: CodeEmporium
    est_minutes: 16
    community_verdict: Short, code-first companion while you write your own attention.
    caveat: Not a full transformer, just the attention block.
    cost: free
  - kind: docs
    title: PyTorch — nn.MultiheadAttention and nn.TransformerEncoderLayer
    url: https://docs.pytorch.org/docs/stable/generated/torch.nn.MultiheadAttention.html
    provider: PyTorch
    est_minutes: 25
    community_verdict: Worth reading after you've written your own, to compare against the production
      implementation.
    caveat: The batch_first argument trips up almost everyone once.
    cost: free
  - kind: repo
    title: minGPT (the readable reference implementation)
    url: https://github.com/karpathy/minGPT
    provider: Andrej Karpathy
    est_minutes: 45
    community_verdict: ~300 lines, deliberately readable; the reference to check your own version against.
    caveat: Read it after your attempt, or you'll just transcribe it.
    cost: free
  - kind: video
    title: "Let's build the GPT Tokenizer"
    url: "https://www.youtube.com/watch?v=zduSFxRajkE"
    provider: "Andrej Karpathy"
    est_minutes: 120
    community_verdict: "Tokenization is where most people's mental model of an LLM quietly breaks, and it explains a startling number of real bugs — weird arithmetic, broken non-English text, off-by-one prompt lengths. Karpathy builds BPE from nothing."
    caveat: "Two hours on one preprocessing step. Worth it, but do it after your mini-transformer runs, not before."
    cost: free
  assignments:
  - slug: m6-attention-impl
    title: Implement scaled dot-product attention
    brief: 'Implement single-head and multi-head attention with correct masking. Hidden tests check shapes,
      that the causal mask actually prevents attending to future positions, and numerical agreement with
      PyTorch''s own implementation.

      '
    starter_path: curriculum/assignments/m6-attention-impl/starter.py
    tests_path: curriculum/assignments/m6-attention-impl/tests
- slug: m6-nanogpt-read
  title: Understand nanoGPT — read it, trace it, modify it
  objective: 'Read a production-quality small codebase and change one thing. Explicitly NOT ''reproduce
    GPT-2''.

    '
  why: "Reading a real, small codebase is how you learn to change models you did not write, which is most of the job."
  outcomes:
    - "Trace one forward pass through nanoGPT's model.py"
    - "Change one setting, train again, and compare the loss"
  needs: [m6-mini-transformer]
  est_minutes: 120
  resources:
  - kind: video
    title: "Let's reproduce GPT-2 (124M) — section 1 only: the model file"
    url: https://www.youtube.com/watch?v=l8pRSuU81PU
    provider: Andrej Karpathy
    est_minutes: 241
    watch:
      - title: "The GPT-2 model file, written line by line"
        video: "l8pRSuU81PU"
        from: "3:39"
        to: "1:22:18"
        why: >
          Exploring the real GPT-2 weights, writing the nn.Module that loads
          them, the forward pass, sampling, a first training loop and the
          weight initialisation: nanoGPT's model.py, explained as it is
          typed. Stops where the speed-ups and the multi-GPU run begin.
    community_verdict: The same model file as nanoGPT, typed and explained line by line by its
      author, which makes the repo below readable rather than intimidating.
    caveat: Only section 1. The rest of the video is the four-hour GPT-2 reproduction this module
      deliberately does not ask for, and it needs far more than an 8 GB GPU.
    cost: free
  - kind: repo
    title: nanoGPT
    url: https://github.com/karpathy/nanoGPT
    provider: Andrej Karpathy
    est_minutes: 90
    community_verdict: The clearest small GPT training codebase; widely used as a teaching reference.
    caveat: Reproducing GPT-2 with it needs serious compute — far beyond an 8 GB laptop GPU. Read and
      modify only.
    cost: free
  - kind: playlist
    title: 'CS336: Language Modeling from Scratch (Stanford, Spring 2025)'
    url: https://www.youtube.com/playlist?list=PLoROMvodv4rOY23Y0BoGoBGgQ1zmU_MT_
    provider: Stanford
    est_minutes: 90
    optional_stretch: true
    community_verdict: Fully public 2025 course covering tokenization, architectures, kernels, scaling
      laws, inference and evals — the structured way to go deep.
    caveat: Graduate-level and demanding. This is the optional-stretch path, not a requirement.
    cost: free
  - kind: docs
    title: nanoGPT training config walkthrough (repo README)
    url: https://github.com/karpathy/nanoGPT#quick-start
    provider: Andrej Karpathy
    est_minutes: 20
    community_verdict: Enough to run the Shakespeare-scale model on your own GPU, which is the right scale
      here.
    caveat: The GPT-2 reproduction section assumes 8×A100. Skip it.
    cost: free
  - kind: video
    title: "Deep Dive into LLMs like ChatGPT"
    url: "https://www.youtube.com/watch?v=7xTGNNLPyMI"
    provider: "Andrej Karpathy"
    est_minutes: 210
    community_verdict: "The whole pipeline end to end — pretraining, the data, SFT, RLHF, hallucination, why models can't count letters — from someone who built these systems. It joins every piece of M6 and M7 into one picture."
    caveat: "Three and a half hours. Treat it as four sittings with notes, not a background video."
    cost: free
  - kind: repo
    title: "nanochat — the whole ChatGPT pipeline in one readable repo"
    url: "https://github.com/karpathy/nanochat"
    provider: "Andrej Karpathy"
    est_minutes: 90
    community_verdict: "nanoGPT only pretrains. This carries the same minimal, readable style all the way through tokenizer, midtraining, SFT and a chat UI — the reference for what the full stack actually contains."
    caveat: "Training the full thing costs real GPU hours. Read it and run the smallest configuration; don't budget for a full run on a 4060."
    cost: free
  cards:
  - front: Why is reproducing GPT-2 a bad graduation requirement?
    back: It's a compute-bound engineering slog, not a learning-bound one. The understanding comes from
      writing a mini-transformer and reading nanoGPT; the rest is a bill.
- slug: m6-finetune-lora
  title: Hugging Face, fine-tuning, and LoRA/PEFT
  objective: 'Fine-tune a real pretrained model on a real task with a real eval, using LoRA so it fits
    in 8 GB.

    '
  why: "Project 3 fine-tunes a real model, and LoRA is what makes that fit on your 8 GB card."
  outcomes:
    - "Load a pretrained model and its tokenizer from the Hugging Face Hub"
    - "Fine-tune it with LoRA so it fits in 8 GB of GPU memory"
    - "Evaluate it on held-out data that was never in its training set"
  needs: [m5-training-loop, m6-architecture]
  est_minutes: 150
  needs_gpu: true
  rigor_note: 'Rung: contamination checks and a held-out eval set you constructed yourself. A benchmark
    the base model already memorised proves nothing.

    '
  resources:
  - kind: playlist
    title: Fine-tuning with LoRA, then QLoRA on one GPU
    url: https://www.youtube.com/playlist?list=PLz-ep5RbHosU2hnz5ejezwaYpdMutMVB0
    provider: Shaw Talebi
    est_minutes: 63
    watch:
      - title: "Fine-tuning an LLM with LoRA, with code"
        video: "eC6Hd1hFvos"
        from: "0:32"
        to: "28:18"
        why: >
          What fine-tuning is, the three ways to do it, how LoRA works, then
          loading a model, preparing data, evaluating before and after, and
          training with LoRA.
      - title: "QLoRA: fine-tuning on a single GPU"
        video: "XpoKB3usmKc"
        from: "0:45"
        to: "35:22"
        why: >
          Quantisation and the four ingredients of QLoRA, then a 7B model
          fine-tuned on one GPU. This is the version that fits in 8 GB.
    community_verdict: Short, current and code-first; the QLoRA video is exactly the 8 GB problem this
      unit has.
    caveat: His examples use Colab GPUs. On the 4060, start from the smallest model that does your task
      and only then scale up.
    cost: free
  - kind: course
    title: Hugging Face LLM Course — chapter 11, supervised fine-tuning and LoRA
    url: https://huggingface.co/learn/llm-course/chapter11/1
    provider: Hugging Face
    est_minutes: 90
    community_verdict: The written, kept-current version of this unit, with SFTTrainer, chat templates,
      LoRA and evaluation.
    caveat: Reading, not video. Use it when a call in the videos no longer matches the current library.
    cost: free
  - kind: docs
    title: Unsloth — fine-tuning that fits small GPUs
    url: https://docs.unsloth.ai/
    provider: Unsloth
    est_minutes: 30
    community_verdict: Popular for fitting LoRA and QLoRA into consumer GPU memory, with ready
      notebooks per model.
    caveat: Moves quickly and pins its own library versions; follow one notebook exactly before you
      change anything.
    cost: free
  - kind: paper
    title: 'LoRA: Low-Rank Adaptation of Large Language Models'
    url: https://arxiv.org/abs/2106.09685
    provider: Hu et al.
    est_minutes: 45
    community_verdict: The technique that makes fine-tuning possible on consumer GPUs; short and readable.
    caveat: Read after you've fine-tuned something the naive way and hit an OOM.
    cost: free
  - kind: docs
    title: PEFT — parameter-efficient fine-tuning docs
    url: https://huggingface.co/docs/peft/index
    provider: Hugging Face
    est_minutes: 40
    community_verdict: Practical recipes for LoRA/QLoRA that run on 8 GB.
    caveat: Moves fast; pin your versions or examples break.
    cost: free
  cards:
  - front: What does LoRA actually train?
    back: Two small low-rank matrices per target layer, with the base weights frozen. Far fewer trainable
      parameters, so it fits in consumer VRAM.
  - front: What is benchmark contamination?
    back: The evaluation data was in the model's pretraining corpus, so scores measure memorisation, not
      capability. Build your own held-out set.
projects:
- slug: p3-finetune
  title: Project 3 — fine-tuned model that beats a sane baseline
  brief: 'Fine-tune a model on a task you care about. Must include a baseline (zero-shot or a classical
    model), your own held-out eval set, a contamination check, and an honest account of where it fails.

    '
  requires_deployment: false
