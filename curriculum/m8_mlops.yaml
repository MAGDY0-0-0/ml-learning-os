slug: m8-mlops
title: M8 · ML systems & MLOps
order: 8
blurb: 'Getting a model out of a notebook and into something that runs, is monitored, and can be re-run
  six months later. This is the module that separates "trained a model" from "shipped a model".

  '
outcomes:
  - "Record every training run so it can be reproduced"
  - "Serve a model behind an API inside a Docker container"
  - "Test ML code and notice when live data drifts"
units:
- slug: m8-tracking
  title: Experiment tracking and versioning
  objective: 'Make every run reproducible: code version, data version, config, seed, metrics. Replace
    ''final_v3_actually_final.ipynb'' with something real.

    '
  why: "Rung R6 of the Rigor Ladder asks for reproducible results, and every project's reported number has to be re-runnable."
  outcomes:
    - "Log a run's parameters, metrics and model with MLflow"
    - "Record the five things a run needs to be reproduced"
    - "Compare runs side by side and pick the best one honestly"
  est_minutes: 180
  rigor_note: 'The reproducibility rung, completed. A clean clone plus a command should reproduce your
    reported number.

    '
  resources:
  - kind: playlist
    title: MLOps Zoomcamp, module 2 — experiment tracking (6 videos)
    url: https://www.youtube.com/playlist?list=PL3MmuxUbc_hIUISrluw_A7wDSmfOhErJK
    provider: DataTalksClub
    est_minutes: 114
    watch:
      - title: "2.1 Experiment tracking: the idea"
        video: "MiA7LQin9c8"
        from: "0:00"
        to: "14:32"
        why: >
          What a run is and what must be recorded so it can be reproduced.
      - title: "2.2 Getting started with MLflow"
        video: "cESCQE9J3ZE"
        from: "0:00"
        to: "11:44"
        why: >
          Installing MLflow and opening its UI locally.
      - title: "2.3 Tracking experiments with MLflow"
        video: "iaJz-T7VWec"
        from: "0:00"
        to: "24:05"
        why: >
          Logging parameters, metrics and artefacts from a real training
          script.
      - title: "2.4 Model management"
        video: "OVUPIX88q88"
        from: "0:00"
        to: "16:22"
        why: >
          Saving models with their environment so they can be loaded again.
      - title: "2.5 The model registry"
        video: "TKHU7HAvGH8"
        from: "0:00"
        to: "35:20"
        why: >
          Promoting a run's model to staging and production, and rolling
          back.
      - title: "2.7 MLflow: benefits, limits and alternatives"
        video: "Lugy1JPsBRY"
        from: "0:00"
        to: "11:42"
        why: >
          When MLflow is worth it and what else people use.
    community_verdict: Free, video-led and project-based; one of the few genuinely free full MLOps courses
      with an active community.
    caveat: Cohort-oriented — some videos assume the cohort's homework context. Skips 2.6, a 42-minute
      tour of deployment scenarios this unit does not need.
    cost: free
  - kind: video
    title: MLflow Python Tutorial - ML Model Experiment Tracking
    url: https://www.youtube.com/watch?v=kn51WgTTjCw
    provider: JCharisTech
    est_minutes: 25
    community_verdict: Focused purely on tracking, which is the only part of MLflow you need at first.
    caveat: Older UI in places.
    cost: free
  - kind: video
    title: MLflow Full Course (MLOps + LLMOps)
    url: https://www.youtube.com/watch?v=_Ox2Ft0xumE
    provider: datageekrj
    est_minutes: 135
    community_verdict: Very recent and covers LLM experiment tracking too.
    caveat: Long; treat as reference.
    cost: free
  - kind: docs
    title: MLflow documentation
    url: https://mlflow.org/docs/latest/index.html
    provider: MLflow
    est_minutes: 60
    community_verdict: The most widely deployed open-source tracking tool; runs locally with no account.
    caveat: The UI is dated and the API surface is broad — you need only tracking at first.
    cost: free
  - kind: repo
    title: MLOps Zoomcamp — course repo and homework
    url: https://github.com/DataTalksClub/mlops-zoomcamp
    provider: DataTalksClub
    est_minutes: 90
    community_verdict: The code and exercises behind the videos; self-paceable at any time.
    caveat: Some notebooks bit-rot between cohorts; pin versions.
    cost: free
  cards:
  - front: What five things must be recorded for a run to be reproducible?
    back: Code version (git commit), data version, config/hyperparameters, random seed, and the environment
      (pinned dependencies). Missing any one usually breaks reproduction.
- slug: m8-serving
  title: Serving a model behind an API, and containerising it
  objective: 'Wrap a trained model in FastAPI, containerise it, and understand the latency/throughput
    trade-offs. You already know FastAPI from M1.

    '
  why: "A model is only useful once something can call it. The live demo in M9 depends on this."
  outcomes:
    - "Write a Dockerfile for a Python app and build an image"
    - "Run the container and reach the app through a port"
    - "Serve a model behind a FastAPI endpoint"
  needs: [m1-fastapi-basics]
  est_minutes: 150
  resources:
  - kind: playlist
    title: Docker in an hour, then a model served from a container
    url: https://www.youtube.com/playlist?list=PL3MmuxUbc_hIUISrluw_A7wDSmfOhErJK
    provider: TechWorld with Nana, and DataTalksClub
    est_minutes: 89
    watch:
      - title: "Docker: images, containers, ports and a Dockerfile"
        video: "pg19Z8LL06w"
        from: "2:54"
        to: "1:03:39"
        why: >
          What Docker solves, images versus containers, running and stopping
          containers, port binding, and writing and building a Dockerfile.
          Skips the intro and the closing overview.
      - title: "Serving a model as a web service, in Docker"
        video: "D7wfMAdgdF8"
        from: "0:00"
        to: "28:42"
        why: >
          A trained model wrapped in a web service and put in a container,
          end to end.
    community_verdict: Nana's crash course is the most-recommended short Docker introduction, and the
      Zoomcamp video is exactly this unit's job done once in front of you.
    caveat: The Zoomcamp video uses Flask; the steps carry over to the FastAPI you know from M1. On
      Windows, Docker Desktop needs WSL - run `wsl --install` before this unit.
    cost: free
  - kind: video
    title: Docker Tutorial for Beginners — full course
    url: https://www.youtube.com/watch?v=fqMOX6JJhGo
    provider: freeCodeCamp
    est_minutes: 130
    community_verdict: Standard free Docker on-ramp; covers images, volumes and compose.
    caveat: From 2019 and twice as long; choose it if you want volumes and compose covered too.
    cost: free
  - kind: article
    title: Made With ML — serving and production lessons
    url: https://madewithml.com/
    provider: Goku Mohandas / Anyscale
    est_minutes: 120
    community_verdict: Well-regarded free written course connecting modelling to production practice.
    caveat: Written lessons are free; the live cohort is paid — we skip the cohort. Ray-flavoured in places.
    cost: free
  - kind: docs
    title: FastAPI — deployment and concurrency
    url: https://fastapi.tiangolo.com/deployment/
    provider: Sebastián Ramírez
    est_minutes: 45
    community_verdict: Directly reusable — same framework this app runs on.
    caveat: Doesn't cover GPU inference specifics or batching.
    cost: free
  cards:
  - front: Why is a synchronous model call inside an async FastAPI endpoint a problem?
    back: It blocks the event loop, so one slow inference stalls every other request. Run it in a threadpool
      or a dedicated worker.
- slug: m8-monitoring
  title: Testing ML code, drift, and monitoring
  objective: 'Test things that have no fixed correct answer, and detect when the world moves away from
    your training distribution.

    '
  why: "A model that passed every test can still go wrong once real data changes. This is how you notice."
  outcomes:
    - "Write tests for model code whose output is not fixed"
    - "Explain the difference between data drift and concept drift"
    - "Check live data for drift against the training data"
  needs: [m8-serving]
  est_minutes: 135
  resources:
  - kind: playlist
    title: MLOps Zoomcamp — monitoring, and testing ML code (6 videos)
    url: https://www.youtube.com/playlist?list=PL3MmuxUbc_hIUISrluw_A7wDSmfOhErJK
    provider: DataTalksClub
    est_minutes: 106
    watch:
      - title: "5.1 Introduction to ML monitoring"
        video: "SQ0jBwd_3kk"
        from: "0:00"
        to: "12:18"
        why: >
          What to monitor in a model in production, including data drift and
          concept drift.
      - title: "5.3 Reference data and a model"
        video: "IjNrkqMYQeQ"
        from: "0:00"
        to: "20:50"
        why: >
          Building the reference set that live data is compared against.
      - title: "5.4 Drift metrics with Evidently"
        video: "kP3lzh_HfWY"
        from: "0:00"
        to: "10:41"
        why: >
          Computing drift between reference and current data.
      - title: "5.7 Data quality monitoring"
        video: "fytrmPbcLhI"
        from: "0:00"
        to: "13:43"
        why: >
          Catching broken or missing inputs before they reach the model.
      - title: "5.9 Debugging with test suites and reports"
        video: "sNSk3ojISh8"
        from: "0:00"
        to: "16:58"
        why: >
          Turning a drift alert into an explanation.
      - title: "6.1 Testing Python code with pytest"
        video: "CJp1eFQP5nk"
        from: "0:00"
        to: "31:38"
        why: >
          Unit tests for model code: fixed inputs, tolerances and shapes
          rather than exact outputs.
    community_verdict: Hands-on drift detection and dashboards rather than theory.
    caveat: Tool-specific (Evidently, Grafana); the concepts outlive the tools. Video 5.2 sets up the
      Docker services the later ones use, if you want to follow along exactly.
    cost: free
  - kind: repo
    title: applied-ml — real production ML case studies
    url: https://github.com/eugeneyan/applied-ml
    provider: Eugene Yan
    est_minutes: 60
    community_verdict: A large curated list of how real companies actually built and monitored ML systems;
      free and frequently recommended.
    caveat: A reading list, not a course — pick 3-4 write-ups relevant to your project.
    cost: free
  - kind: repo
    title: ml-engineering — the practical open handbook
    url: https://github.com/stas00/ml-engineering
    provider: Stas Bekman
    est_minutes: 60
    community_verdict: Hard-won operational detail from someone who trained large models in production.
    caveat: Skewed toward large-scale training infrastructure; much is beyond a laptop's scope.
    cost: free
  - kind: course
    title: Full Stack Deep Learning (2022)
    url: https://fullstackdeeplearning.com/course/2022/
    provider: FSDL
    est_minutes: 120
    community_verdict: Was the best production-ML course of its era; still strong on testing, monitoring
      and project structure.
    caveat: 2022 — predates the current LLM tooling entirely. Use for principles, not tools.
    cost: free
  cards:
  - front: How do you unit-test a model whose output isn't deterministic?
    back: 'Test the invariants instead: output shape and type, monotonicity, behaviour on known-easy cases,
      and a minimum score on a fixed held-out slice.'
  - front: Data drift vs concept drift?
    back: 'Data drift: the input distribution changed. Concept drift: the input->output relationship changed.
      The second is worse and harder to detect.'
