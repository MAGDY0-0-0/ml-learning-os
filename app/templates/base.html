<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}ML Learning OS{% endblock %}</title>
  <link rel="stylesheet" href="{{ asset('static/style.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🧠</text></svg>">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>

{% set path = request.url.path %}
<header class="topbar">
  <a class="brand" href="/">🧠 ML Learning OS</a>
  <nav aria-label="Main">
    <a href="/"         {% if path == '/' %}aria-current="page"{% endif %}>Dashboard</a>
    <a href="/review"   {% if path.startswith('/review') %}aria-current="page"{% endif %}>Review</a>
    <a href="/projects" {% if path.startswith('/project') %}aria-current="page"{% endif %}>Projects</a>
    <a href="/library"  {% if path.startswith('/library') %}aria-current="page"{% endif %}>Library</a>
    <a href="/tour"     {% if path.startswith('/tour') %}aria-current="page"{% endif %}>Guide</a>
  </nav>
</header>

<main id="main">
  {% block body %}{% endblock %}
</main>

<footer>
  Runs only on your laptop · data in <code>A:\ml\data\app.db</code>
</footer>
</body>
</html>
