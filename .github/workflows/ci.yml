name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Mondays 06:17 UTC: re-verify every curriculum URL still resolves.
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - name: Curriculum rules
        run: python -m app.seed --check
      - name: Tests
        run: python -m pytest tests -q

  links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - name: Every resource URL still resolves
        run: python -m app.seed --check --urls
